[log_levels]
DEFAULT="INFO"
LOG_PERF=1

; uncomment these as needed, but probably copy this to config.local.ini (gitignored)
; and/or don't check in the change. debug output will never show up in the final build.
; strings or numbers are fine (0=DEBUG, etc)
;AudioManager=0
;Game="DEBUG"
;Player="DEBUG"

[log_format]
; [icon, ticks_msec, source, message]
base_line="%s %8d %s: %s"

DEBUG="[color=DIM_GRAY]%s[/color]"
WARNING="[color=YELLOW]%s[/color]"
ERROR="[color=ORANGE]%s[/color]"

PERF="⌚️ [color=DIM_GRAY] %8d %s %s: %dms[/color]"

; Life="[color=BLUE]%s[/color]"

[log_icon]
DEBUG="🙈"
INFO="👀"
WARNING="⚠️"
ERROR="‼️"

; Life="❤️"

[display]
fullscreen_enabled=false
pixelization_enabled=true
pixelization_scale=4
outline_enabled=true
outline_width=1
crt_effect_enabled=false
crt_effect_alpha=0.5
scanline_effect_enabled=false
scanline_effect_alpha=0.25
screen_bezel_enabled=false
palette_quantization_enabled=true
palette_index_in_use=0
hp_labels_enabled=true
healthbars_enabled=true
